name: Generate fabrication files
on:
  workflow_dispatch:
  push:
   paths-ignore:
   - '*.md'

jobs:
  generate:
    name: Generate fabrication files
    runs-on: ubuntu-24.04
    
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7
        with:
          path: ZuluSCSI-Blaster-Ultra-Lite-kicad
      
      - name: Install dependencies
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --no-install-recommends kicad python3 wget
          sudo apt-get install gsettings-backend libcairo2 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk2.0-0 libdxflib3
          sudo pip3 install git+https://github.com/yaqwsx/KiKit.git
          git clone https://github.com/openscopeproject/InteractiveHtmlBom.git

      - name: Install gerbv
        run: |
          git clone https://github.com/gerbv/gerbv.github.io.git
          cd gerbv.github.io/ci/
          sudo apt-get install --yes ./gerbv*Ubuntu*.deb
      
      - name: Generate fabrication files
        run: |
          export PATH=`pwd`/InteractiveHtmlBom/InteractiveHtmlBom:$PATH
          export INTERACTIVE_HTML_BOM_NO_DISPLAY=1
          cd ZuluSCSI-Blaster-Ultra-Lite-kicad
          mkdir -p images
          ./kikit_run.sh
      
      - name: Upload JLCPCB gerbers
        uses: actions/upload-artifact@v7
        with:
          path: ZuluSCSI-Blaster-Ultra-Lite-kicad/gerbers/jlcpcb.zip
          name: ZuluSCSI-gerbers-for-JLCPCB

      - name: Upload OSHPARK gerbers
        uses: actions/upload-artifact@v7
        with:
          path: ZuluSCSI-Blaster-Ultra-Lite-kicad/gerbers/oshpark.zip
          name: ZuluSCSI-gerbers-for-OSHPARK

      - name: Upload PCBWAY gerbers
        uses: actions/upload-artifact@v7
        with:
          path: ZuluSCSI-Blaster-Ultra-Lite-kicad/gerbers/pcbway.zip
          name: ZuluSCSI-gerbers-for-PCBWAY

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          path: ZuluSCSI-Blaster-Ultra-Lite-kicad/images/*
          name: ZuluSCSI-Images-of-the-PCB

